<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nanoseek</title>
<style>
  :root {
    --bg: #fbfaf8;
    --panel: #ffffff;
    --ink: #1c1b1a;
    --muted: #6b6864;
    --line: #e6e2dc;
    --accent: #b8562f;
    --accent-soft: #f6e9e2;
    --mark: #ffe6a8;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a;
      --panel: #1f1e23;
      --ink: #eceaf0;
      --muted: #9c98a4;
      --line: #32303a;
      --accent: #e8825a;
      --accent-soft: #35261f;
      --mark: #5c4a1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 80px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .tagline { color: var(--muted); font-size: 14px; }
  .stats { margin: 6px 0 22px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .searchbar { display: flex; gap: 8px; }
  input[type=text], input[type=number], textarea {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { border-color: var(--accent); }

  .controls { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .modes { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .modes button { border: 0; border-radius: 0; padding: 6px 12px; font-size: 13px; }
  .modes button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .controls input[type=number] { width: 68px; padding: 6px 8px; }

  .results { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
  .hit { position: relative; }
  .hit h2 { margin: 0 0 4px; font-size: 16px; }
  .hit .snippet { color: var(--muted); font-size: 14px; margin: 0; }
  .hit mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
  .scores { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip {
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 9px;
  }
  .chip.lead { color: var(--accent); border-color: var(--accent); }
  .del {
    position: absolute; top: 12px; right: 12px;
    padding: 3px 9px; font-size: 12px; color: var(--muted);
  }
  .empty { color: var(--muted); font-size: 14px; padding: 24px 4px; }
  .error { color: #fff; background: #b3261e; border-radius: 8px; padding: 10px 14px; margin-top: 14px; font-size: 14px; }

  details.add { margin-top: 24px; }
  details.add summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details.add .card { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
  textarea { min-height: 96px; resize: vertical; }
  footer { margin-top: 36px; color: var(--muted); font-size: 12.5px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>nano<span>seek</span></h1>
    <p class="tagline">hybrid search — BM25 + hashed vectors, fused with RRF</p>
  </header>
  <p class="stats" id="stats">loading index…</p>

  <div class="card">
    <form class="searchbar" id="search-form">
      <input type="text" id="q" placeholder="Ask the corpus something…" autocomplete="off" autofocus>
      <button class="primary" type="submit">Search</button>
    </form>
    <div class="controls">
      <div class="modes" id="modes">
        <button type="button" data-mode="hybrid" aria-pressed="true">hybrid</button>
        <button type="button" data-mode="lexical" aria-pressed="false">lexical</button>
        <button type="button" data-mode="vector" aria-pressed="false">vector</button>
      </div>
      <label>top&nbsp;<input type="number" id="k" value="5" min="1" max="50"></label>
      <span id="timing"></span>
    </div>
  </div>

  <div id="error" hidden class="error"></div>
  <div class="results" id="results"></div>

  <details class="add">
    <summary>Add a document to the index</summary>
    <form class="card" id="add-form">
      <input type="text" id="doc-title" placeholder="Title">
      <textarea id="doc-text" placeholder="Text to index…"></textarea>
      <div><button class="primary" type="submit">Index it</button></div>
    </form>
  </details>

  <footer>
    API: <code>GET /api/search?q=…&amp;mode=hybrid&amp;k=5</code> ·
    <code>POST /api/documents</code> ·
    <code>GET /api/stats</code>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let mode = "hybrid";

function showError(message) {
  const box = $("error");
  box.textContent = message;
  box.hidden = !message;
}

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `${res.status} ${res.statusText}`);
  return body;
}

async function refreshStats() {
  try {
    const s = await api("/api/stats");
    $("stats").textContent =
      `${s.documents} documents · ${s.terms} unique terms · ${s.avg_length.toFixed(1)} tokens per document`;
  } catch (err) {
    $("stats").textContent = "index unavailable";
  }
}

const escapeHTML = (s) => s.replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Words too common or too short to be worth marking up. Highlighting "I" or
// "to" paints the whole passage orange and hides the terms that matter.
const NOISE = new Set(["the", "and", "for", "are", "was", "but", "not", "you",
  "how", "what", "why", "who", "does", "did", "can", "should", "would", "with",
  "this", "that", "from", "into", "about", "your", "its", "his", "her", "their"]);

// Highlight query terms inside an already-escaped string, so the markup we add
// is the only markup in there.
function highlight(text, query) {
  const safe = escapeHTML(text);
  const terms = (query.toLowerCase().match(/[\p{L}\p{N}]+/gu) || [])
    .filter((t) => t.length >= 3 && !NOISE.has(t));
  if (!terms.length) return safe;
  const pattern = terms
    .map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
    .sort((a, b) => b.length - a.length)
    .join("|");
  return safe.replace(new RegExp(`(${pattern})`, "gi"), "<mark>$1</mark>");
}

function renderResults(query, results) {
  const box = $("results");
  box.innerHTML = "";
  if (!results.length) {
    box.innerHTML = `<p class="empty">Nothing matched “${escapeHTML(query)}”.</p>`;
    return;
  }
  for (const hit of results) {
    const el = document.createElement("article");
    el.className = "card hit";
    el.innerHTML = `
      <button class="del" data-id="${escapeHTML(hit.document.id)}" title="Remove from index">remove</button>
      <h2>${highlight(hit.document.title || hit.document.id, query)}</h2>
      <p class="snippet">${highlight(hit.snippet, query)}</p>
      <div class="scores">
        <span class="chip lead">score ${hit.score.toFixed(4)}</span>
        <span class="chip">bm25 ${hit.lexical.toFixed(3)}</span>
        <span class="chip">cosine ${hit.vector.toFixed(3)}</span>
        <span class="chip">${escapeHTML(hit.document.id)}</span>
      </div>`;
    box.appendChild(el);
  }
}

async function runSearch() {
  const query = $("q").value.trim();
  if (!query) { $("results").innerHTML = ""; $("timing").textContent = ""; return; }
  showError("");
  const started = performance.now();
  try {
    const params = new URLSearchParams({ q: query, mode, k: $("k").value || "5" });
    const data = await api(`/api/search?${params}`);
    $("timing").textContent = `${data.count} hits in ${(performance.now() - started).toFixed(0)} ms`;
    renderResults(query, data.results);
  } catch (err) {
    showError(err.message);
  }
}

$("search-form").addEventListener("submit", (e) => { e.preventDefault(); runSearch(); });

// Some embedded browsers do not fire implicit form submission on Enter, so
// search from the keypress directly rather than relying on it.
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); runSearch(); }
});

$("modes").addEventListener("click", (e) => {
  const button = e.target.closest("button[data-mode]");
  if (!button) return;
  mode = button.dataset.mode;
  for (const b of $("modes").querySelectorAll("button")) {
    b.setAttribute("aria-pressed", String(b === button));
  }
  runSearch();
});

$("k").addEventListener("change", runSearch);

$("results").addEventListener("click", async (e) => {
  const button = e.target.closest("button.del");
  if (!button) return;
  try {
    await api(`/api/documents/${encodeURIComponent(button.dataset.id)}`, { method: "DELETE" });
    await Promise.all([refreshStats(), runSearch()]);
  } catch (err) {
    showError(err.message);
  }
});

$("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const title = $("doc-title").value.trim();
  const text = $("doc-text").value.trim();
  if (!title && !text) return;
  try {
    await api("/api/documents", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title, text }),
    });
    $("doc-title").value = "";
    $("doc-text").value = "";
    showError("");
    await Promise.all([refreshStats(), runSearch()]);
  } catch (err) {
    showError(err.message);
  }
});

refreshStats();
</script>
</body>
</html>
